name: Deploy

on:
  push:
    branches: main
    # Everything the Worker bundle is built from. A path missing here means the
    # Worker silently keeps serving the previous build.
    paths:
      - "apps/worker/**"
      - "packages/core/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - name: "Setup node"
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: "Install dependencies"
        run: npm ci

      # The Worker bundles against core's compiled output.
      - name: "Build"
        run: npm run build

      - name: "Typecheck"
        run: npm run typecheck

      - name: "Lint"
        run: npm run lint

      - name: "Deploy to Cloudflare"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            COOKIE_ENCRYPTION_KEY
          vars: WORKER_HOST
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
