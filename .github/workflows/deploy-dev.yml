name: Deploy to Development

run-name: Deploy to 'dev'

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - name: "Setup node"
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: "Install dependencies"
        run: npm ci

      # The Worker bundles against core's compiled output.
      - name: "Build"
        run: npm run build

      - name: "Typecheck"
        run: npm run typecheck

      - name: "Lint"
        run: npm run lint

      - name: "Load secrets from 1Password"
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          GOOGLE_CLIENT_ID: op://google-tag-manager-mcp-server-dev/GOOGLE_CLIENT_ID/password
          GOOGLE_CLIENT_SECRET: op://google-tag-manager-mcp-server-dev/GOOGLE_CLIENT_SECRET/password
          COOKIE_ENCRYPTION_KEY: op://google-tag-manager-mcp-server-dev/COOKIE_ENCRYPTION_KEY/password
          CLOUDFLARE_ACCOUNT_ID: op://google-tag-manager-mcp-server-dev/CLOUDFLARE_ACCOUNT_ID/password

      # CLOUDFLARE_API_TOKEN is the same token for dev and prod. It will be moved to 1Password later.
      - name: "Deploy to Cloudflare"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          environment: dev
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            COOKIE_ENCRYPTION_KEY
          vars: WORKER_HOST
        env:
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          COOKIE_ENCRYPTION_KEY: ${{ env.COOKIE_ENCRYPTION_KEY }}
          WORKER_HOST: ${{ vars.WORKER_HOST_DEV }}
