name: Release

on:
  push:
    branches: main
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm trusted publishing: npm exchanges the job's OIDC token for a
  # short-lived publish credential, so no NPM_TOKEN is stored anywhere.
  id-token: write

jobs:
  release:
    if: ${{ github.actor != 'stape-releaser[bot]' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint

      - name: "Load secrets from 1Password"
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          RELEASER_APP_ID: op://github-actions-shared/releaser/app_id
          RELEASER_APP_KEY: op://github-actions-shared/releaser/app_key

      - name: Create GitHub App token
        id: gh_app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.RELEASER_APP_ID }}
          private-key: ${{ env.RELEASER_APP_KEY }}

      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.gh_app.outputs.token }}
